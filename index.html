<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Parry — On-device AI</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

<style>
  html, body {
    margin: 0; padding: 0;
    background: #ECE8E1;
    font-family: 'Inter', system-ui, sans-serif;
    color: #1A1815;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  * { box-sizing: border-box; }
</style>

<script>
  window.__TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "accent": "#FF5B2E"
  }/*EDITMODE-END*/;
</script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>

  <style>
    #fallback-landing {
      display: none;
      min-height: 100vh;
      padding: 24px;
      font-family: Inter, system-ui, sans-serif;
      color: #1A1815;
      background: #ECE8E1;
    }
    #fallback-landing .card {
      max-width: 760px;
      margin: 0 auto;
      border: 1px solid #ddd4ca;
      border-radius: 16px;
      padding: 22px;
      background: rgba(255,255,255,0.78);
      box-shadow: 0 16px 40px rgba(23, 21, 16, 0.08);
    }
    #fallback-landing h1 { margin: 0 0 12px; font-family: "Instrument Serif", serif; }
  </style>
</head>
<body>
  <div id="root"></div>
  <main id="fallback-landing">
    <div class="card">
      <p style="margin:0 0 8px; color:#7A736A; font-size:12px; letter-spacing:1.4px; text-transform:uppercase;">Parry</p>
      <h1 style="font-size:44px; line-height:1.02;">Say it. <em style="color:#FF5B2E; font-style:normal;">I’ll repeat.</em></h1>
      <p style="margin:0; max-width:560px; color:#665f58; line-height:1.55;">Parry mobile + web design showcase is loading. If you still see this card, JavaScript execution is failing and I can help you isolate the exact runtime error.
      </p>
      <pre id="fallback-error" style="display:none; margin:14px 0 0; background:#fff5e6; border:1px solid #ffd39a; color:#6a4b1d; border-radius:10px; padding:10px; white-space:pre-wrap; font-size:12px; max-width:760px;"></pre>
      <p style="margin:14px 0 0; color:#8b8177;">Try opening this page in a newer browser and disabling extensions.</p>
    </div>
  </main>

  <script type="text/babel" data-presets="react" src="Resources/ios-frame.jsx"></script>
  <script type="text/babel" data-presets="react" src="Resources/browser-window.jsx"></script>
  <script type="text/babel" data-presets="react" src="Resources/design-canvas.jsx"></script>
  <script type="text/babel" data-presets="react" src="Resources/tweaks-panel.jsx"></script>
  <script type="text/babel" data-presets="react" src="Resources/parry-shared.jsx"></script>
  <script type="text/babel" data-presets="react" src="Resources/parry-mascot.jsx"></script>
  <script type="text/babel" data-presets="react" src="Resources/parry-phone-centered.jsx"></script>
  <script type="text/babel" data-presets="react" src="Resources/parry-phone-editorial.jsx"></script>
  <script type="text/babel" data-presets="react" src="Resources/parry-phone-dark.jsx"></script>
  <script type="text/babel" data-presets="react" src="Resources/parry-desktop-centered.jsx"></script>
  <script type="text/babel" data-presets="react" src="Resources/parry-desktop-editorial.jsx"></script>
  <script type="text/babel" data-presets="react" src="Resources/parry-desktop-stage.jsx"></script>
  <script type="text/babel" data-presets="react" src="Resources/parry-app.jsx"></script>

  <script>
    (function () {
      window.__PARRY_APP_READY = false;
      var root = document.getElementById('root');
      var fallback = document.getElementById('fallback-landing');
      var errorBox = document.getElementById('fallback-error');
      var errors = [];

      function setFallbackError(reason) {
        errors.push(reason);
        if (errorBox) {
          errorBox.style.display = 'block';
          errorBox.textContent = errors.join('\n\n');
        }
      }

      function revealFallback() {
        if (!root || !fallback || root.children.length > 0) return;
        var fallback = document.getElementById('fallback-landing');
        if (!fallback) return;
        fallback.style.display = 'grid';
        fallback.style.alignItems = 'center';
        fallback.style.placeItems = 'center';
        if (errors.length === 0) setFallbackError('No runtime error captured yet. React did not mount before the guard timeout.');
      }

      window.addEventListener('error', function (e) {
        if (e && e.error && e.error.stack) {
          setFallbackError((e.error.stack || '').toString());
        } else if (e && e.message) {
          setFallbackError(e.message.toString());
        }
        revealFallback();
      });

      window.addEventListener('unhandledrejection', function (e) {
        var reason = (e && e.reason && (e.reason.stack || e.reason.message || e.reason.toString())) || 'Unhandled promise rejection';
        setFallbackError(reason.toString());
        revealFallback();
      });

      if (root && root instanceof Node && window.MutationObserver) {
        new MutationObserver(function () {
          if (root.children && root.children.length > 0 && fallback) {
            fallback.style.display = 'none';
          }
        }).observe(root, { childList: true });
      }

      window.addEventListener('load', function () {
        setTimeout(function () {
          if (!window.__PARRY_APP_READY) revealFallback();
        }, 2000);
      });
    })();
  </script>

</body>
</html>
